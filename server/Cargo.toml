[package]
name = "web-ts"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
async-trait = "=0.1.92"
rtc = "=0.21.0"
aes-gcm = "0.10"
argon2 = "0.5"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bytes = "1"
futures = "0.3"
getrandom = "0.3"
hex = "0.4"
hmac = "0.12"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "ring", "webpki-roots"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha1 = "=0.10.7"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "0.9"
tower-http = { version = "0.6", features = ["fs", "limit", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tsclientlib = { path = "../vendor/tsclientlib/tsclientlib", default-features = false, features = ["raw-audio"] }
tsproto = { path = "../vendor/tsclientlib/tsproto" }
tsproto-packets = { path = "../vendor/tsclientlib/utils/tsproto-packets" }
tsproto-types = { path = "../vendor/tsclientlib/utils/tsproto-types" }
webrtc = "=0.21.0"
zeroize = "1"
url = "2"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
ammonia = "=4.2.1"
pulldown-cmark = { version = "=0.13.0", default-features = false, features = ["html"] }
percent-encoding = "=2.3.2"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
md-5 = "=0.10.6"

rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio-tungstenite = "=0.29.0"
