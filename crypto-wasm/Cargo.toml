[package]
name = "webts-crypto"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vodozemac = { version = "=0.11.1", default-features = false, features = ["wasm_js"] }
wasm-bindgen = "=0.2.129"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
