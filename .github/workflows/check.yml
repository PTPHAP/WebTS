name: Build and checks
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  schedule:
    - cron: '21 3 * * 1'
permissions:
  contents: read
jobs:
  dependencies:
    if: github.event_name != 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check public dependency advisories (fail closed)
        run: python3 scripts/audit-dependencies.py
  rust:
    if: github.event_name != 'release'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Apply protocol patch
        run: sh scripts/prepare-vendor.sh
      - name: Format
        run: cargo fmt --package web-ts --package webts-crypto -- --check
      - name: Check
        run: cargo check --workspace --locked
      - name: Safety tests
        run: cargo test --workspace --locked
      - name: Protocol file transfer boundary tests
        run: rustc --test vendor/tsclientlib/tsclientlib/src/filetransfer_security.rs -o /tmp/webts-ft-tests && /tmp/webts-ft-tests
      - name: Lint project code
        run: cargo clippy --package web-ts --package webts-crypto --no-deps --locked -- -D warnings
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.20.0
      - name: Build pinned Olm WASM
        run: sh scripts/build-crypto.sh
      - name: Verify Olm feature boundary
        run: |
          cargo tree --invert vodozemac -e features | tee .cache/olm-features.txt
          if grep -E 'vodozemac feature "(fuzzing|experimental-session-config)"' .cache/olm-features.txt; then exit 1; fi
      - name: Frontend
        working-directory: web
        run: npm ci --no-audit --no-fund && npm test && npm run build
      - name: Linux release package
        run: |
          cargo build --release --package web-ts --locked
          python3 scripts/tests/recovery-smoke.py --binary target/release/web-ts
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("server/Cargo.toml", "rb"))["package"]["version"])')
          mkdir -p .cache/package/webts-$version-linux-x64/web
          cp target/release/web-ts .cache/package/webts-$version-linux-x64/
          cp -r web/dist .cache/package/webts-$version-linux-x64/web/
          cp -r deploy docs scripts README.md CHANGELOG.md PRIVACY.md TERMS.md LICENSE THIRD_PARTY_NOTICES.md config.example.toml .cache/package/webts-$version-linux-x64/
          sh scripts/collect-licenses.sh .cache/package/webts-$version-linux-x64/licenses
          chmod +x .cache/package/webts-$version-linux-x64/scripts/run.sh
          tar -czf .cache/webts-$version-linux-x64.tar.gz -C .cache/package webts-$version-linux-x64
          sha256sum .cache/webts-$version-linux-x64.tar.gz > .cache/SHA256SUMS_LINUX
      - name: Native Linux node preview and public package
        run: |
          python3 scripts/tests/node-smoke.py --binary target/release/web-ts
          python3 scripts/package-node.py --binary target/release/web-ts --platform linux-x64 --target x86_64-unknown-linux-gnu --runtime 'Ubuntu 22.04 / glibc 2.35' --output .cache/node-release
      - name: Debian 12 native binary compatibility
        run: |
          set -euo pipefail
          python3 scripts/tests/node-glibc-check.py --binary target/release/web-ts
          stage=$(mktemp -d)
          cp target/release/web-ts scripts/tests/node-smoke.py "$stage/"
          docker build -f scripts/tests/Dockerfile.node-debian12 -t webts-node-debian12:ci "$stage"
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --memory 256m --cpus 1 --pids-limit 128 --tmpfs /work/.cache:rw,nosuid,nodev,noexec,mode=1777,size=32m webts-node-debian12:ci
      - name: Real isolated Linux node installation and upgrade
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: sudo --preserve-env=GITHUB_ACTIONS python3 scripts/tests/node-linux-smoke.py --package .cache/node-release/*linux-x64.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: webts-release-linux
          if-no-files-found: error
          include-hidden-files: true
          path: |
            .cache/webts-*-linux-x64.tar.gz
            .cache/SHA256SUMS_LINUX
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: webts-release-node-linux
          if-no-files-found: error
          path: .cache/node-release/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: webts-frontend
          if-no-files-found: error
          path: web/dist
  private-browser:
    if: github.event_name != 'release'
    needs: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.20.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: webts-frontend
          path: .cache/browser-frontend
      - name: Use exact-commit audio and Olm assets
        run: |
          mkdir -p web/public/crypto web/public/audio
          cp .cache/browser-frontend/crypto/* web/public/crypto/
          cp .cache/browser-frontend/audio/* web/public/audio/
      - name: Install locked test dependencies and isolated browsers
        working-directory: web
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium firefox webkit
      - name: Provide a real isolated audio sink for Firefox
        run: |
          set -euo pipefail
          if command -v pactl >/dev/null; then pactl info || true; fi
          sudo apt-get install -y --no-install-recommends pulseaudio
          pulseaudio --check || pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=webts_ci
          pactl set-default-sink webts_ci
          node web/tests/browser/audio-backend.mjs
      - name: Real browser cryptographic lifecycle matrix
        working-directory: web
        run: npm run test:browser
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: webts-release-linux
          path: .cache
      - name: Real gateway quick login and public-device matrix
        run: |
          set -euo pipefail
          sha256sum -c .cache/SHA256SUMS_LINUX
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("server/Cargo.toml", "rb"))["package"]["version"])')
          mkdir -p .cache/quick-login-native web/dist
          tar -xzf .cache/webts-$version-linux-x64.tar.gz -C .cache/quick-login-native --strip-components=1 webts-$version-linux-x64/web-ts
          cp -r .cache/browser-frontend/. web/dist/
          python3 scripts/tests/quick-login-smoke.py --binary .cache/quick-login-native/web-ts --browsers chromium firefox webkit mobile-webkit
  docker:
    if: github.event_name != 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          persist-credentials: false
      - name: Validate deployment and build container
        run: |
          bash -n install.sh
          bash -n install-node.sh
          python3 -m unittest discover -s scripts/tests -v
          WEBTS_DOMAIN=voice.example.com docker compose config --quiet
          docker build -t webts:ci .
          docker run --rm webts:ci init-key /tmp/master.key
      - name: Real Chinese installer smoke on isolated runner
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: sudo --preserve-env=GITHUB_ACTIONS,GITHUB_SHA python3 scripts/tests/install-smoke.py
      - name: Verify complete source archive deployment
        run: |
          python3 scripts/package-source.py
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("server/Cargo.toml", "rb"))["package"]["version"])')
          unzip -q .cache/source-release/webts-$version-source.zip -d /tmp/webts-source-check
          cd /tmp/webts-source-check/webts-$version-source
          docker build -t webts:source-ci .
          docker run --rm webts:source-ci init-key /tmp/master.key
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: webts-release-source
          if-no-files-found: error
          include-hidden-files: true
          path: |
            .cache/source-release/webts-*-source.zip
            .cache/source-release/SHA256SUMS_SOURCE
      - name: Export tested Docker image
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("server/Cargo.toml", "rb"))["package"]["version"])')
          docker tag webts:ci webts:$version
          docker save webts:$version | gzip > .cache/webts-$version-docker-linux-x64.tar.gz
          sha256sum .cache/webts-$version-docker-linux-x64.tar.gz > .cache/SHA256SUMS_DOCKER
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: webts-release-docker
          if-no-files-found: error
          include-hidden-files: true
          path: |
            .cache/webts-*-docker-linux-x64.tar.gz
            .cache/SHA256SUMS_DOCKER
  windows:
    if: github.event_name != 'release'
    needs: rust
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install pinned native toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --target x86_64-pc-windows-msvc
      - name: Apply protocol patch
        run: ./scripts/prepare-vendor.ps1
      - name: Build native gateway with static C runtime
        env:
          RUSTFLAGS: '-C target-feature=+crt-static'
        run: cargo +1.99.0 build --release --package web-ts --target x86_64-pc-windows-msvc --locked
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: webts-frontend
          path: web/dist
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.20.0
      - name: Install locked frontend licenses
        working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate Windows setup, session start and package
        run: |
          python scripts/tests/windows-smoke.py --binary target/x86_64-pc-windows-msvc/release/web-ts.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/tests/recovery-smoke.py --binary target/x86_64-pc-windows-msvc/release/web-ts.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/package-windows.py --binary target/x86_64-pc-windows-msvc/release/web-ts.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows node preview, installation regression and real isolated OS acceptance
        run: |
          python scripts/tests/node-smoke.py --binary target/x86_64-pc-windows-msvc/release/web-ts.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/package-node.py --binary target/x86_64-pc-windows-msvc/release/web-ts.exe --platform windows-x64 --target x86_64-pc-windows-msvc --runtime 'Windows Server 2025 / static MSVC CRT' --output .cache/node-release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $package = (Get-ChildItem .cache/node-release/*windows-x64.zip).FullName
          python scripts/tests/node-windows-smoke.py --package $package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/tests/node-windows-smoke.py --package $package --native-os
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: webts-release-windows
          if-no-files-found: error
          include-hidden-files: true
          path: |
            .cache/windows-release/webts-*-windows-x64.zip
            .cache/windows-release/SHA256SUMS_WINDOWS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: webts-release-node-windows
          if-no-files-found: error
          path: .cache/node-release/*
  release-assets:
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Require successful checks for this exact release commit
        id: verified-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          run_id=$(gh run list --workflow check.yml --branch main --event push --status success --limit 30 --json headSha,databaseId --jq ".[] | select(.headSha == \"$sha\") | .databaseId" | head -n 1)
          test -n "$run_id"
          mkdir -p .cache
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" > .cache/verified-jobs.json
          python3 -c 'import json; jobs=json.load(open(".cache/verified-jobs.json"))["jobs"]; expected={"dependencies","rust","docker","windows","private-browser"}; selected=[j for j in jobs if j["name"] in expected]; assert len(selected)==5 and {j["name"] for j in selected}==expected and all(j["conclusion"]=="success" for j in selected)'
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.verified-run.outputs.run-id }}
          pattern: webts-release-*
          path: .cache/release-assets
          merge-multiple: true
      - name: Verify all packages and attach to this release
        env:
          GH_TOKEN: ${{ github.token }}
          WEBTS_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 scripts/verify-release.py .cache/release-assets "$WEBTS_RELEASE_TAG"
          gh release upload "$WEBTS_RELEASE_TAG" .cache/release-assets/* --repo "$GITHUB_REPOSITORY"
