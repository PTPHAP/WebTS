name: Rust checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Apply protocol patch
        run: sh scripts/prepare-vendor.sh
      - name: Format
        run: cargo fmt --package web-ts -- --check
      - name: Check
        run: cargo check --workspace --locked
      - name: Safety tests
        run: cargo test --workspace --locked
      - name: Lint project code
        run: cargo clippy --package web-ts --no-deps --locked -- -D warnings
