    <text x="600" y="157" fill="#d0d7ec" font-size="21" letter-spacing="1">Your TeamSpeak. In your browser.</text>
    <text x="600" y="197" fill="#9baccd" font-size="14" letter-spacing="2">SELF-HOSTED / REAL IDENTITIES / ENCRYPTED VOICE</text>
