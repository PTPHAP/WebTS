<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{title}}</title></head>
<body style="margin:0;background:#f3f6f8;color:#20333b;font-family:'Segoe UI','Microsoft YaHei',sans-serif">
<div style="display:none;max-height:0;overflow:hidden">{{description}} 链接15分钟内有效。</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td align="center" style="padding:40px 16px">
<table role="presentation" width="560" cellpadding="0" cellspacing="0" style="width:100%;max-width:560px">
<tr><td style="padding:0 8px 24px;font-size:25px;font-weight:700;letter-spacing:-1px">Web<span style="color:#138269">TS</span><span style="font-size:12px;font-weight:400;color:#72828e;letter-spacing:2px;padding-left:18px">让声音相聚</span></td></tr>
<tr><td style="background:#ffffff;border:1px solid #e0e8ed;border-radius:20px;padding:36px 30px">
<p style="margin:0 0 20px;font-size:11px;letter-spacing:2px;color:#138269">YOUR ACCOUNT · 账号安全</p>
<h1 style="margin:0 0 18px;font-size:26px;font-weight:600;line-height:1.4">{{title}}</h1>
<p style="margin:0 0 28px;font-size:14px;color:#657783;line-height:1.9">{{description}}</p>
<table role="presentation" cellpadding="0" cellspacing="0"><tr><td bgcolor="#138269" style="border-radius:10px"><a href="{{link}}" style="display:inline-block;padding:15px 30px;color:#ffffff;font-size:15px;font-weight:600;text-decoration:none">{{action}} &nbsp;→</a></td></tr></table>
<p style="margin:20px 0 28px;font-size:12px;color:#72828e">15 分钟内有效 &nbsp;·&nbsp; 仅可使用一次</p>
<div style="background:#eff8f4;border:1px solid #dceee5;border-radius:10px;padding:14px 16px;font-size:12px;line-height:1.9;color:#41685b">{{note}}</div>
<p style="margin:28px 0 8px;font-size:12px;color:#72828e">按钮无法打开？复制下方链接到浏览器：</p>
<p style="margin:0;font-size:11px;line-height:1.8;word-break:break-all"><a href="{{link}}" style="color:#138269;text-decoration:underline">{{link}}</a></p>
</td></tr>
<tr><td style="padding:22px 8px;color:#82909a;font-size:11px;line-height:1.9">如果不是你发起的操作，请忽略此邮件。请勿转发验证或找回链接。<br>来自 {{origin}} · WebTS 是独立开源项目。</td></tr>
</table></td></tr></table>
</body></html>
